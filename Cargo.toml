[workspace]
resolver = "2"
members = ["cli", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "An Accurate & Fast SGI O2 Emulator."
repository = "https://github.com/samueltgg12/o2rust"

[workspace.dependencies]
# Core library
o2rust = { path = "." }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Error handling
thiserror = "2"

# Bit manipulation
bitflags = "2"

# Byte order helpers
byteorder = "1"

# GUI (egui + eframe)
eframe = "0.31"
egui = "0.31"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization (save states, config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
anyhow = "1"

# JIT compilation (Phase 3)
cranelift = "0.135.1"
cranelift-module = "0.135.1"
cranelift-jit = "0.135.1"

# Windowing & input
winit = "0.30"
raw-window-handle = "0.6"

# OpenGL context (glutin + glutin-winit)
glutin = "0.32"
glutin-winit = "0.5"

# Audio (cpal) + low-latency ring buffer (rtrb)
cpal = "0.18.2"
rtrb = "0.4.0"

# File dialogs (rfd)
rfd = "0.17.2"

# CHD disk image support
libchdman-rs = { version = "0.289", features = ["prebuilt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[package]
name = "o2rust"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "o2rust"
path = "src/lib.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
log.workspace = true
thiserror.workspace = true
bitflags.workspace = true
byteorder.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
cranelift   = "0.135.1"
cranelift-module   = "0.135.1"
cranelift-jit = "0.135.1"